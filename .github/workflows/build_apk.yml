name: Flutter APK Online Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

            - name: Rebuild Android Directory Structure
        run: |
          flutter create . --platforms=android --force

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in xml:
              xml = xml.replace(
                  "<application",
                  f"    {permission}\n    <application",
                  1,
              )

          cleartext = 'android:usesCleartextTraffic="true"'
          if cleartext not in xml:
              xml = xml.replace(
                  "<application",
                  f'<application {cleartext}',
                  1,
              )

          manifest.write_text(xml)
          print(xml)
          PY


      - name: Install Project Dependencies
        run: flutter pub get

      - name: Compile Production APK
        run: flutter build apk --release

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: water-delivery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
