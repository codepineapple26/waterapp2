name: Flutter APK Online Compiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rebuild Android directory structure
        run: |
          if [ ! -d "android/app/src/main" ]; then
            flutter create . --platforms=android --force
          fi

          python3 - <<'PY'
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest_path.exists():
              raise FileNotFoundError(f"AndroidManifest.xml not found: {manifest_path}")

          xml = manifest_path.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in xml:
              xml = xml.replace(
                  "<application",
                  f"    {permission}\n    <application",
                  1,
              )

          cleartext = 'android:usesCleartextTraffic="true"'
          if cleartext not in xml:
              xml = xml.replace(
                  "<application",
                  f'<application {cleartext}',
                  1,
              )

          manifest_path.write_text(xml)
          print("AndroidManifest.xml updated for INTERNET + cleartext traffic")
          PY

      - name: Install project dependencies
        run: flutter pub get

      - name: Compile production APK
        run: flutter build apk --release

      - name: Upload finished APK file
        uses: actions/upload-artifact@v4
        with:
          name: water-delivery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
