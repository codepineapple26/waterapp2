name: Flutter APK Online Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Inject Android Local Network Permissions
        run: |
          # 1. Force generate the missing native Android directory tree
          flutter create . --platforms=android --force
          
          # 2. Add internet use permissions to the manifest file
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml
          
          # 3. Force Android to allow cleartext HTTP (non-HTTPS) traffic to your local IP address
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Production APK
        run: flutter build apk --release

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: water-delivery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
