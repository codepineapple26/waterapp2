name: Flutter APK Online Compiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: false

      - name: Configure Flutter SDK for Gradle
        shell: bash
        run: |
          FLUTTER_SDK_PATH="$(dirname "$(dirname "$(which flutter)")")"
          mkdir -p android
          if [ -f android/local.properties ] && grep -q '^flutter\.sdk=' android/local.properties; then
            sed -i "s|^flutter\.sdk=.*|flutter.sdk=${FLUTTER_SDK_PATH}|" android/local.properties
          else
            echo "flutter.sdk=${FLUTTER_SDK_PATH}" >> android/local.properties
          fi
          cat android/local.properties

      - name: Install project dependencies
        run: flutter pub get

      - name: Compile production APK
        run: flutter build apk --release

      - name: Upload finished APK file
        uses: actions/upload-artifact@v4
        with:
          name: water-delivery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
