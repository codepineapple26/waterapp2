name: Flutter APK Online Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Android Directory Structure
        run: |
          # 1. Force-create a completely fresh android folder directly in the root workspace
          flutter create . --platforms=android --force
          
          # 2. Add the cleartext rule so your phone app can talk to your Chromebook IP
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Compile Production APK
        run: flutter build apk --release

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: water-delivery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
