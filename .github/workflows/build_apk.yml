name: Flutter APK Online Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: repo_code

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flawless Project Structure
        run: |
          # 1. Create a brand new, mathematically perfect Flutter template in a fresh folder
          flutter create water_app_fresh --platforms=android
          
          # 2. Safely copy your custom water delivery code into this perfect structure
          cp repo_code/pubspec.yaml water_app_fresh/pubspec.yaml
          cp repo_code/lib/main.dart water_app_fresh/lib/main.dart
          
          # 3. Inject the Android network permission so your phone can talk to your Chromebook over HTTP
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' water_app_fresh/android/app/src/main/AndroidManifest.xml

      - name: Compile Production APK
        run: |
          cd water_app_fresh
          flutter pub get
          flutter build apk --release

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: water-delivery-apk
          path: water_app_fresh/build/app/outputs/flutter-apk/app-release.apk
